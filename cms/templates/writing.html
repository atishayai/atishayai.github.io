<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C0C0C">
<title>Writing — atishay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

{{SITE_NAV}}

<main class="container v2-page-main">

  <section class="page-head">
    <div class="eyebrow reveal">No. II — Writing</div>
    <h1 class="reveal d1"><span class="accent">Fiction</span><br>&amp; non-fiction.</h1>
    <p class="blurb reveal d2">Essays, short fiction, zines, and the occasional column. <span class="ink">A working bibliography, updated as the year permits.</span></p>
  </section>

  <div class="tabs-bar reveal">
    <span class="label">Read as</span>
    <button class="tab active" data-pane="fiction">Fiction</button>
    <span class="sep">·</span>
    <button class="tab" data-pane="nonfiction">Non-fiction</button>
  </div>

  <section class="writing-list">

    <div class="wpane active" id="paneFiction">

{{FICTION_ROWS}}

    </div>

    <div class="wpane" id="paneNonfiction">

{{NONFICTION_ROWS}}

    </div>

  </section>

</main>

{{SITE_FOOTER}}

<script src="scripts/site.js" defer></script>
<script>
  document.querySelectorAll('.tabs-bar .tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const pane = btn.dataset.pane;
      document.querySelectorAll('.tabs-bar .tab').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.wpane').forEach(p => p.classList.toggle('active', p.id === 'pane' + pane.charAt(0).toUpperCase() + pane.slice(1)));
    });
  });

  if (location.hash) {
    const target = location.hash.replace('#', '');
    const btn = document.querySelector(`.tab[data-pane="${target}"]`);
    if (btn) btn.click();
  }
</script>
</body>
</html>
