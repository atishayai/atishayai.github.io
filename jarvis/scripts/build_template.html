     Deliberately omitted for now: pointing og:image at a file that does not exist
     makes scrapers render a blank card, which looks more broken than no image. -->

<meta property="og:title" content="Jarvis — your whole college life, one place">
<meta property="og:description" content="Build your Cornell schedule, track every major and minor requirement, and find the classes that count toward more than one at once. Free, no account.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234C8DFF'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%230C0C12' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%230C0C12'/%3E%3C/svg%3E">
<style>
:root{--bg:#0C0C12;--panel:#16161F;--panel2:#1E1E2A;--line:#2B2B3B;--line-rgb:43,43,59;--accent:#4C8DFF;--accent-rgb:76,141,255;--purple:#A855F7;--purple-rgb:168,85,247;--amber:#FFD24C;--amber-rgb:255,210,76;--red:#FF6B6B;--red-rgb:255,107,107;--green:#34D399;--green-rgb:52,211,153;--dim:#9595AB;--txt:#F3F3F9;--scrim-rgb:4,4,9;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;--mono:'SF Mono',ui-monospace,Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;letter-spacing:.5px;font-weight:650;color:var(--accent)}
nav{display:flex;gap:4px;flex:1}
nav button{background:none;border:1px solid transparent;border-radius:8px;color:var(--dim);font-family:inherit;font-size:12.5px;letter-spacing:.2px;font-weight:550;padding:9px 14px;cursor:pointer}
nav button:hover{color:var(--txt)}
nav button.on{color:var(--accent);border-color:var(--line);background:rgba(var(--accent-rgb),.06)}
#cr{font-size:10px;color:var(--dim)}#cr b{color:var(--txt);font-size:13px}
main{flex:1;overflow:auto;padding:18px 22px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
input[type=text],textarea{background:var(--panel);border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:12px;padding:9px 12px;border-radius:8px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--accent)}
button.b{background:rgba(var(--accent-rgb),.08);border:1px solid var(--line);color:var(--accent);font-family:inherit;font-size:12.5px;font-weight:550;padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
button.b:hover{background:rgba(var(--accent-rgb),.16)}
button.b.rm{color:var(--red);background:rgba(var(--red-rgb),.06)}
.dim{color:var(--dim)}.fine{font-size:11.5px;color:var(--dim);line-height:1.7}
/* schedule */
#sch{display:grid;grid-template-columns:300px 1fr 240px;gap:14px;height:calc(100vh - 110px)}
#coursepane{display:flex;flex-direction:column;gap:8px;min-height:0}
#results{flex:1;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.crs{padding:11px 12px;border-bottom:1px solid var(--line);cursor:grab;font-size:13px}
.crs:hover{background:rgba(var(--accent-rgb),.05)}
.crs b{color:var(--accent);font-weight:600;font-family:var(--mono)}
.crs .t{display:block;font-size:10px;color:var(--dim);margin-top:2px;line-height:1.4}
.crs:active{cursor:grabbing}
#gridwrap{min-height:0;display:flex;flex-direction:column}
#grid{border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;grid-template-columns:40px repeat(5,1fr);overflow-y:auto;align-content:start;flex:1}
#grid .hd{position:sticky;top:0;z-index:2;background:var(--panel2);padding:8px 0;text-align:center;font-size:10px;letter-spacing:2px;color:var(--accent);border-bottom:1px solid var(--line)}
.dcol{position:relative;border-left:1px solid var(--line)}
.dcol.over{background:rgba(var(--accent-rgb),.06)}
.hl{position:absolute;left:0;right:0;border-top:1px solid rgba(var(--line-rgb),.6)}
.tc{position:relative}.tc span{position:absolute;right:5px;font-size:8px;color:var(--dim);transform:translateY(-50%)}
.blk{position:absolute;left:3%;width:94%;border:1px solid var(--accent);background:rgba(var(--accent-rgb),.1);color:var(--accent);border-radius:6px;padding:3px 6px;font-size:9px;line-height:1.3;overflow:hidden}
.blk.x{border-color:var(--red);background:rgba(var(--red-rgb),.12);color:var(--red)}
#enr{display:flex;flex-direction:column;gap:8px;min-height:0}
#enrlist{flex:1;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:4px 10px}
.en{padding:8px 0;border-bottom:1px solid var(--line);font-size:11px}
.en select{background:var(--panel);border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:9.5px;padding:3px 6px;border-radius:6px;margin-top:4px;max-width:100%}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.4px;color:var(--dim);text-align:left;padding:8px;border-bottom:1px solid var(--line);text-transform:uppercase;white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line)}
tr:hover td{background:rgba(var(--accent-rgb),.03)}
a{color:var(--accent);text-decoration:none}
.hit{display:inline-block;min-width:20px;text-align:center;border-radius:5px;padding:1px 5px;font-weight:bold;background:rgba(var(--accent-rgb),.14);color:var(--accent)}
/* todos */
.todo{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);font-size:14px}
.todo input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.todo.done span{color:var(--dim);text-decoration:line-through}
.todo span{flex:1}
.todo .x{color:var(--dim);cursor:pointer;font-size:14px}.todo .x:hover{color:var(--red)}
/* notes */
#notes{display:grid;grid-template-columns:240px 1fr;gap:14px;height:calc(100vh - 110px)}
#nlist{overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.ni{padding:12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.ni:hover{background:rgba(var(--accent-rgb),.05)}
.ni.on{background:rgba(var(--accent-rgb),.08);border-left:2px solid var(--accent)}
.ni .d{font-size:9px;color:var(--dim);margin-top:2px}
#ned{display:flex;flex-direction:column;gap:8px}
#ntext{flex:1;resize:none;line-height:1.7;font-size:12.5px}
/* calendar */
#cal{max-width:760px}
#calhead{display:flex;align-items:center;gap:14px;margin-bottom:10px}
#calhead h2{font-size:14px;letter-spacing:2px;color:var(--accent);flex:1;text-align:center}
#calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:10px;color:var(--dim);cursor:pointer;background:var(--panel)}
.cd:hover{border-color:var(--accent)}
.cd.today{border-color:var(--amber)}
.cd.sel{border-color:var(--accent);background:rgba(var(--accent-rgb),.06)}
.cd .n{color:var(--txt);font-size:11px}
.cd .ev{color:var(--accent);font-size:8.5px;margin-top:2px;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dow{text-align:center;font-size:9px;letter-spacing:2px;color:var(--dim);padding:4px 0}
/* brain */
#brainwrap{position:relative;height:calc(100vh - 160px);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
#bsvg{width:100%;height:100%;cursor:grab}#bsvg.g{cursor:grabbing}
.lk{stroke:var(--line);stroke-width:1.2;fill:none}
.nd{cursor:pointer}.nd circle{fill:var(--panel);stroke:var(--accent);stroke-width:1.5}
.nd.sel circle{stroke:var(--amber);stroke-width:2.5}
.nd text{fill:var(--txt);font-family:var(--mono);pointer-events:none;text-anchor:middle}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--panel);font-size:11px;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
#onboard{position:fixed;inset:0;background:rgba(var(--scrim-rgb),.45);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center}
#obcard{width:min(440px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px;text-align:center}
#obcard h2{font-size:26px;letter-spacing:-.3px;font-weight:680;color:var(--accent)}
#obcard p{font-size:14px;color:var(--dim);line-height:1.8;margin:14px 0 20px}
#obcard input{text-align:center;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* ===== the simple app ===== */
body.focus header{display:none}            /* no nav until they have an answer */
body.focus main{padding:0}
.ask{max-width:520px;margin:0 auto;padding:38px 20px 60px}
.asklogo{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);font-weight:700;margin-bottom:22px}
.ask h1{font-size:clamp(30px,6vw,42px);font-weight:720;letter-spacing:-.025em;line-height:1.12}
.ask p{font-size:17px;color:var(--dim);line-height:1.6;margin:12px 0 34px}
.q{display:block;position:relative;margin-bottom:22px}
.qnum{position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.qtext{display:block;font-size:19px;font-weight:620;margin:0 0 10px 38px;line-height:1.35}
.q select{display:block;width:100%;font-family:inherit;font-size:18px;font-weight:500;
  padding:16px 18px;border:2px solid var(--line);border-radius:13px;background:var(--panel);
  color:var(--txt);cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 22px) 25px,calc(100% - 16px) 25px;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
.q select:focus{border-color:var(--accent);outline:none}
.go{display:block;width:100%;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;border:none;border-radius:14px;
  font-family:inherit;font-size:19px;font-weight:680;padding:19px;cursor:pointer;margin-top:32px;
  box-shadow:0 6px 18px rgba(var(--accent-rgb),.28);transition:transform .12s,box-shadow .12s}
.go:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(var(--accent-rgb),.34)}
.ghost{display:block;width:100%;background:none;border:2px solid var(--line);border-radius:14px;
  font-family:inherit;font-size:16px;font-weight:600;padding:15px;cursor:pointer;color:var(--dim);margin-top:10px}
.askfoot{font-size:13.5px;color:var(--dim);text-align:center;margin-top:22px;line-height:1.8}
.askfoot a{display:block;margin-top:4px}
/* result */
.result{max-width:560px;margin:0 auto;padding:26px 20px 60px}
.rhead{margin-bottom:22px}
.rbig{font-size:clamp(27px,5.4vw,36px);font-weight:720;letter-spacing:-.02em}
.rsub{font-size:16.5px;color:var(--dim);margin-top:9px;line-height:1.55}
.bcard{border:2px solid var(--line);border-radius:16px;background:var(--panel);margin-bottom:13px;overflow:hidden}
.bmain{padding:19px 20px;cursor:pointer}
.bmain:hover{background:rgba(var(--accent-rgb),.035)}
.bcode{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.btitle{font-size:20px;font-weight:640;line-height:1.3;margin:3px 0 7px}
.bwhen{font-size:16px;color:var(--dim)}
.btags{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.tag{font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--panel2);color:var(--dim)}
.tag-count{background:rgba(var(--purple-rgb),.18);color:var(--purple)}
.tag-open{background:rgba(var(--green-rgb),.14);color:var(--green)}
.tag-full{background:rgba(var(--red-rgb),.12);color:var(--red)}
.bwhy{font-size:14.5px;font-weight:600;color:var(--accent);margin-top:14px}
.bproof{border-top:2px solid var(--line);background:var(--panel2);padding:15px 20px}
.pline{padding:8px 0;font-size:15px;line-height:1.5}
.pline b{display:block;font-weight:640}
.pline span{color:var(--dim);font-size:14px}
.pline a{font-size:14px}
.ractions{margin-top:24px}
/* ===== board ===== */
.board{max-width:560px;margin:0 auto;padding:26px 18px 60px}
.bhead{margin-bottom:18px}
.btitle2{font-size:clamp(26px,5.4vw,34px);font-weight:720;letter-spacing:-.02em}
.bsub{font-size:16px;color:var(--dim);margin-top:7px}
.bsub .warn{color:var(--amber)}.bsub .good{color:var(--green)}
.bstamp{font-size:12.5px;color:var(--dim);opacity:.7;margin-top:5px}
.addbox{position:relative;margin-bottom:18px}
.addbox input{width:100%;font-family:inherit;font-size:16.5px;padding:15px 17px;border:2px solid var(--line);
  border-radius:13px;background:var(--panel);color:var(--txt)}
.addbox input:focus{border-color:var(--accent);outline:none}
#addhits{margin-top:6px}
.ahit{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);
  border-radius:10px;margin-top:6px;cursor:pointer;background:var(--panel);font-size:14.5px}
.ahit:hover{border-color:var(--accent)}
.acode{font-family:var(--mono);font-weight:700;color:var(--accent)}
.atitle{flex:1;color:var(--dim)}
.pill{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;white-space:nowrap}
.st-open{background:rgba(var(--green-rgb),.16);color:var(--green)}
.st-full{background:rgba(var(--red-rgb),.16);color:var(--red)}
.st-wait{background:rgba(var(--amber-rgb),.16);color:var(--amber)}
.st-lost{background:rgba(var(--red-rgb),.22);color:var(--red)}
.bcard2{border:2px solid var(--line);border-radius:16px;background:var(--panel);margin-bottom:13px;overflow:hidden}
.bcard2.lost{opacity:.75;border-color:rgba(var(--red-rgb),.4)}
.bc-top{display:flex;align-items:flex-start;gap:12px;padding:17px 18px 12px}
.bc-code{font-family:var(--mono);font-size:14.5px;font-weight:700;color:var(--accent)}
.bc-title{font-size:19px;font-weight:640;line-height:1.3;margin:3px 0 5px}
.bc-when{font-size:15px;color:var(--dim)}
.bc-keeps{font-size:14px;color:var(--dim);padding:0 18px 14px;line-height:1.5}
.bc-keeps b{color:var(--purple);font-weight:640}
.plan-b{border-top:2px solid var(--line);background:var(--panel2);padding:14px 18px}
.pb-head{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:9px}
.pb-row{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
.pb-row:last-child{border-bottom:none}
.pb-keeps{font-size:13px;color:var(--dim);margin-top:2px}
.mini{background:var(--accent);color:#fff;border:none;border-radius:9px;font-family:inherit;
  font-size:13.5px;font-weight:650;padding:9px 14px;cursor:pointer}
.bc-foot{display:flex;gap:16px;padding:11px 18px;border-top:1px solid var(--line);font-size:13.5px}
.bempty{text-align:center;padding:38px 20px;color:var(--txt);font-size:17px;line-height:1.7;
  border:2px dashed var(--line);border-radius:16px}
/* option cards */
.optcard{border:2px solid var(--line);border-radius:16px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.optcard.open{border-color:var(--accent)}
.opt-top{display:flex;align-items:flex-start;gap:12px;padding:18px;cursor:pointer}
.opt-top:hover{background:rgba(var(--accent-rgb),.04)}
.opt-name{font-size:20px;font-weight:680}
.opt-why{font-size:14.5px;color:var(--dim);margin-top:4px;line-height:1.5}
.opt-stats{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;font-size:13.5px;color:var(--dim)}
.opt-stats b{color:var(--txt);font-size:15px}
.opt-stats .ok{color:var(--green);font-weight:650}
.caret2{color:var(--accent);font-size:14px}
.opt-body{border-top:2px solid var(--line);background:var(--panel2);padding:14px 18px 18px}
.opt-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.opt-row:last-of-type{border-bottom:none}
.opt-when{font-size:13.5px;color:var(--dim);margin-top:3px}
.opt-keeps{font-size:13px;color:var(--purple);margin-top:3px}
.params{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.params select{font-family:inherit;font-size:14px;font-weight:550;padding:11px 12px;border:2px solid var(--line);
  border-radius:11px;background:var(--panel);color:var(--txt);cursor:pointer}
.params select:focus{border-color:var(--accent);outline:none}
.chain-step{border-left:3px solid rgba(var(--amber-rgb),.45);padding-left:13px;margin-left:4px}
.chain-if{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--amber);font-weight:700;padding-top:8px}
/* requirement picker */
.rgroup{margin-bottom:22px}
.rglabel{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);font-weight:700}
.rghint{font-size:13.5px;color:var(--dim);margin:3px 0 10px;line-height:1.5}
.rgrow{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border:2px solid var(--line);
  border-radius:13px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.rgrow:hover{border-color:var(--accent)}
.rgrow.on{border-color:var(--accent);background:rgba(var(--accent-rgb),.07)}
.rgrow input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex-shrink:0}
.pickcard{display:flex;align-items:center;gap:10px;padding:16px 18px;border:2px solid var(--line);
  border-radius:14px;margin-top:9px;cursor:pointer;background:var(--panel)}
.pickcard:hover{border-color:var(--accent)}
.pickcard.on{border-color:var(--accent);background:rgba(var(--accent-rgb),.08)}
.pickname{flex:1;font-size:18px;font-weight:640}
.picktag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);font-weight:700}
.pickx{background:none;border:none;color:var(--dim);font-size:17px;cursor:pointer;font-family:inherit;padding:4px 8px}
.pickx:hover{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.chip{font-family:inherit;font-size:14.5px;font-weight:620;padding:10px 16px;border-radius:99px;
  border:2px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer}
.chip.on{border-color:var(--purple);background:rgba(var(--purple-rgb),.14);color:var(--purple)}
.ask input[type=text]{width:100%;font-family:inherit;font-size:17px;padding:16px 18px;border:2px solid var(--line);
  border-radius:14px;background:var(--panel);color:var(--txt);margin-top:4px}
.ask input[type=text]:focus{border-color:var(--accent);outline:none}
.tree{padding:4px 0 2px}
.tnode{display:flex;align-items:center;gap:9px;padding:11px 13px;border:2px solid var(--line);
  border-radius:12px;background:var(--panel);margin:6px 0 0;cursor:pointer}
.tnode:hover{border-color:var(--accent)}
.tname{flex:1;font-size:14.5px;font-weight:620;line-height:1.35}
.tbranch{margin-left:14px;padding-left:13px;border-left:3px solid rgba(var(--accent-rgb),.55)}
.tbranch.d2{border-left-color:rgba(var(--purple-rgb),.6)}

<script>
const DATA = "__INJECT_DATA__";
const CAT = DATA.catalog, PROGRAMS = DATA.programs;
const INSTRUCTORS = DATA.instructors || [];
const IDX = {}; CAT.forEach(r=>IDX[r[0]+' '+r[1]]=r);
const SUBJECTS = [...new Set(CAT.map(r=>r[0]))].sort();
const SUBJECT_NAMES = DATA.subjectNames || {};
const rec=c=>IDX[c], title=c=>rec(c)?rec(c)[2]:'';
const url=c=>{const[s,n]=c.split(' ');return`https://classes.cornell.edu/browse/roster/FA26/class/${s}/${n}`};
const NS='jv3.';
const S=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(NS+k)||'null'):localStorage.setItem(NS+k,JSON.stringify(v));
/* clear any pre-v3 leftovers so every user starts truly clean */
try{Object.keys(localStorage).filter(k=>k.startsWith('cj.')).forEach(k=>localStorage.removeItem(k))}catch(e){}
let plan=S('plan')||[], todos=S('todos')||[], notes=S('notes')||[], events=S('events')||{}, brainN=S('brain')||[{id:'root',label:'🧠 ME',parent:null}], custom=S('custom')||[];
let myRates=S('myrates')||{};
let prefs=S('prefs')||{subjects:[],programs:[],daysOff:[],noBefore:0,noAfter:0,noGrad:false}, reqDone=S('reqs')||{};

if(prefs.noFri!==undefined){prefs={subjects:prefs.subjects||[],programs:prefs.programs||[],daysOff:prefs.noFri?['F']:[],noBefore:prefs.no8?540:0,noAfter:prefs.no6?1080:0,noGrad:false};S('prefs',prefs)}
/* ---- the optimizer engine: personal double-count finder ---- */
// Was a scraped third-party ratings table covering 2% of the catalog, of unclear
// provenance, that also silently broke sort ties. Now it is the student's own rating —
// data we own outright, with no licensing question, and the seed of a real dataset.
function bestRating(codes){let b=0;codes.forEach(c=>{const v=myRates[c]||0;if(v>b)b=v});return b}
const DAYNAMES={M:'Monday',T:'Tuesday',W:'Wednesday',R:'Thursday',F:'Friday'};
function fitsCons(code){ // returns array of violated rules — a course fails only if EVERY section pattern violates
  const out=[],ps=patterns(code);if(!ps.length)return out;
  const r=rec(code);
  (prefs.daysOff||[]).forEach(d=>{if(ps.every(x=>x.days.includes(d)))out.push(DAYNAMES[d])});
  if(prefs.noBefore&&ps.every(x=>{const t=pt(x.time);return t&&t[0]<prefs.noBefore}))out.push('before '+fmMin(prefs.noBefore));
  if(prefs.noAfter&&ps.every(x=>{const t=pt(x.time);return t&&t[1]>prefs.noAfter}))out.push('after '+fmMin(prefs.noAfter));
  if(prefs.noGrad&&r&&r[8]>=5000)out.push('grad-level');
  return out;

function fmMin(m){const h=Math.floor(m/60);return(h>12?h-12:h)+(m%60?':'+String(m%60).padStart(2,'0'):'')+(h<12?'am':'pm')}

  if(prefs.subjects.length<2)return[];
  const mine=new Set(prefs.subjects),seen=new Set(),out=[];
  CAT.forEach(r=>{
    const code=r[0]+' '+r[1];
    if(seen.has(code))return;
    const codes=[code,...(r[6]?r[6].split(', '):[])].filter(x=>x.trim());
    const hit=[...new Set(codes.map(c=>c.split(' ')[0]).filter(s=>mine.has(s)))];

function subjectCodeFor(name){
  // Programs are named like "Anthropology (BA)"; subject names come from the roster.
  // Matches about half of the 221 — used only to pre-tick, never to replace asking.
  const base=name.replace(/\s*\(.*?\)\s*$/,'').trim().toLowerCase();
  if(!base)return null;
  for(const code in SUBJECT_NAMES){
    const nm=(SUBJECT_NAMES[code]||'').trim().toLowerCase();
    if(nm&&nm===base)return code;
  }
  for(const code in SUBJECT_NAMES){
    const nm=(SUBJECT_NAMES[code]||'').trim().toLowerCase();
    if(nm&&(nm.startsWith(base)||base.startsWith(nm)))return code;
  }
  return null;
}
function seedSubjectsFromPrograms(){
  supPrograms.forEach(p=>{const c=subjectCodeFor(p);
    if(c&&SUBJECTS.includes(c)&&!supSubjects.includes(c))supSubjects.push(c)});
}

function tgDay(d){const i=supDays.indexOf(d);i>=0?supDays.splice(i,1):supDays.push(d);drawSup()}

      ${(events[selD]||[]).map((e,i)=>`<div class="todo"><span>${evT(e)}${cChip(evC(e))}</span><span class="x" onclick="events['${selD}'].splice(${i},1);if(!events['${selD}'].length)delete events['${selD}'];S('events',events);cal()">✕</span></div>`).join('')}
      <div class="row" style="margin-top:8px"><input type="text" id="evIn" placeholder="add event / deadline… Enter" onkeydown="if(event.key==='Enter')addEv()">${courseSel('evCourse','')}<button class="b" onclick="addEv()">add</button></div>

  </div>`;
  if(selD){const i=document.getElementById('evIn');if(i)i.focus()}
}
function addEv(){const i=document.getElementById('evIn');if(!i.value.trim())return;
  const sel=document.getElementById('evCourse');
  (events[selD]=events[selD]||[]).push({t:i.value.trim(),c:(sel&&sel.value)||''});

/* ===== THE ENGINE =====
   Generates a schedule rather than helping you build one. Greedy weighted set cover over
   unfilled requirement slots — a course is worth however many STILL-OPEN slots it fills, so
   double-counters win on their own without special-casing — then a swap pass to escape the
   obvious greedy mistakes.

   Row layout: [subj,num,title,credits,days,times,xlist,flags,level,instr,distr,open]
   flags: bit0 = S/U option, bit1 = FWS. */
const REQS=(DATA.requirements&&DATA.requirements.programs)||[];
const BUILT=DATA.built||'';
let myPrograms=S('myprograms')||[];         // requirement program ids being tracked
let doneCourses=S('done')||[];              // already completed (transfer credit + past terms)

function reqProgram(id){return REQS.find(p=>p.id===id)}
function codeOf(r){return r[0]+' '+r[1]}
function isOpen(r){return (r[11]||'')==='O'}
function seatLabel(r){return{O:'open',C:'closed',W:'waitlist'}[r[11]]||'unknown'}

/* Does a course satisfy a match rule? Crosslistings count — a requirement listing
   ANTHR 2430 is satisfied by the ARKEO 2430 that is literally the same class. */
function matchOk(r,m){
  if(!m)return false;
  if(m.attr)return (r[10]||[]).indexOf(m.attr)>-1;
  if(m.from){
    if(m.from.indexOf(codeOf(r))>-1)return true;
    return (r[6]||'').split(', ').some(x=>x&&m.from.indexOf(x)>-1);
  }
  if(m.pred){
    const p=m.pred;
    if(p.isFWS)return !!(r[7]&2);
    if(p.subjects&&p.subjects.indexOf(r[0])<0)return false;
    if(p.minLevel&&r[8]<p.minLevel)return false;
    if(p.maxLevel&&r[8]>p.maxLevel)return false;
    return true;
  }
  if(m.anyOf)return m.anyOf.some(x=>matchOk(r,x));
  return false;
}

/* Every slot still owed, after subtracting what the student has already done. */
function openSlots(){
  const out=[];
  myPrograms.forEach(pid=>{const p=reqProgram(pid);if(!p)return;
    (p.slots||[]).forEach(sl=>{
      const filled=doneCourses.filter(c=>{const r=rec(c);return r&&matchOk(r,sl.match)}).length;
      const left=(sl.need||1)-filled;
      if(left>0)out.push({pid:p.id,pname:p.name,source:p.source,conf:p.confidence,
                          rules:p.rules||{},sid:sl.id,sname:sl.name,note:sl.note,
                          match:sl.match,left:left});
    })});
  return out;
}

/* Program-level rules can disqualify a course outright — the Information Science minor
   forbids S/U, so proposing an S/U-only course there would be a wrong answer, not a
   near miss. */
function ruleOk(r,slot){
  const R=slot.rules||{};
  if(R.noFWS&&(r[7]&2))return false;
  if(R.noSU&&(r[7]&1)&&!(r[7]&0))return true; // S/U *option* is fine; S/U-only is not
  return true;
}
/* A course counts once per PROGRAM, not once per slot. ANTHR 3000 is the Theory core OR a
   3000-level elective — never both plus a general elective, which is what a naive match
   returns and which would triple-count it against the major. Across different programs it
   may legitimately count many times: that is the double-count the whole product rests on.
   Within a program, prefer the most specific slot — an explicit course list beats a
   subject/level predicate, because that is the slot only this course can fill. */
function slotSpecificity(sl){return sl.match&&sl.match.from?2:sl.match&&sl.match.attr?1:0}
function slotsFilledBy(r,slots){
  const hits=slots.filter(sl=>matchOk(r,sl.match)&&ruleOk(r,sl));
  const byProgram={};
  hits.forEach(sl=>{
    const cur=byProgram[sl.pid];
    if(!cur||slotSpecificity(sl)>slotSpecificity(cur))byProgram[sl.pid]=sl;
  });
  return Object.keys(byProgram).map(k=>byProgram[k]);
}
/* Every slot a course *could* fill, ignoring the one-per-program cap. Used by the receipts
   so a student can see the alternatives, and by backups to match on any shared slot. */
function slotsMatchedBy(r,slots){return slots.filter(sl=>matchOk(r,sl.match)&&ruleOk(r,sl))}

/* --- scheduling constraints --- */
function violatesRules(r){return fitsCons(codeOf(r)).length>0}
/* Prerequisites. The roster gives free-form prose ("CHEM 2080 or advanced placement, or
   permission of instructor"), so the logic cannot be evaluated — but the course codes in
   it can. If a course names prerequisites and the student has done none of them, do not
   recommend it. Recommending organic chemistry to someone who has not taken general
   chemistry is a wrong answer, not an ambitious one. Erring toward caution is right for a
   recommender: a missed option costs less than an impossible one. */
function prereqsOf(r){return r[12]||[]}
function prereqMet(r,alsoHave){
  const need=prereqsOf(r);
  if(!need.length)return true;
  const have=doneCourses.concat(alsoHave||[]);
  return need.some(c=>have.indexOf(c)>-1);
}
function firstPattern(code){const p=patterns(code);return p.length?p[0]:null}
function clashes(codeA,codeB){
  const A=firstPattern(codeA),B=firstPattern(codeB);
  if(!A||!B)return false;
  const ta=pt(A.time),tb=pt(B.time);
  if(!ta||!tb)return false;
  if(![...A.days].some(d=>B.days.indexOf(d)>-1))return false;
  return ta[0]<tb[1]&&tb[0]<ta[1];
}
function creditsOf(r){return parseFloat(String(r[3]).split('-')[0])||0}

/* --- the recommendation --- */
function generateSchedule(opts){
  opts=opts||{};
  const target=opts.credits||15, maxC=opts.max||18;
  const slots=openSlots();
  if(!slots.length)return{courses:[],slots:[],reason:'no-programs'};
  const need={}; slots.forEach(sl=>need[sl.pid+'.'+sl.sid]=sl.left);

  // candidates: scheduled, obey the student's rules, not already done, not graduate-level
  const cand=CAT.filter(r=>{
    if(!r[4].length||!r[5].length)return false;
    if(opts.onlyOpen&&!isOpen(r))return false;
    if(opts.notBefore){const t=pt(r[5][0]||'');if(!t||t[0]<opts.notBefore)return false}
    if(doneCourses.indexOf(codeOf(r))>-1)return false;
    if(r[8]>=5000)return false;
    if(opts.maxLevel&&r[8]>opts.maxLevel)return false;
    if(violatesRules(r))return false;
    if(!prereqMet(r))return false;
    return slotsFilledBy(r,slots).length>0;
  });

  /* Raw coverage alone produces a degenerate answer: four anthropology courses, because
     each one scores against both a distribution and the major's permissive elective slot
     while a chemistry course scores one. Nobody takes four courses in one subject. So the
     score also rewards spreading across subjects and across the programs being tracked. */
  const value=(r,chosen)=>{
    let v=0;
    const fills=slotsFilledBy(r,slots);
    fills.forEach(sl=>{if(need[sl.pid+'.'+sl.sid]>0)v++});
    if(!v)return 0;
    if(opts.compact&&chosen.length){
      // reward reusing days the schedule already occupies
      const used={};chosen.forEach(c=>[...(c[4][0]||'')].forEach(d=>used[d]=1));
      const newDays=[...(r[4][0]||'')].filter(d=>!used[d]).length;
      v-=newDays*0.5;
    }
    const sameSubject=chosen.filter(c=>c[0]===r[0]).length;
    v-=sameSubject*0.9;                                  // third course in a subject rarely earns its place
    const progsSoFar={};chosen.forEach(c=>slotsFilledBy(c,slots).forEach(sl=>progsSoFar[sl.pid]=1));
    if(fills.some(sl=>!progsSoFar[sl.pid]))v+=0.5;       // advance a program nothing else touches
    if(!isOpen(r))v-=0.35;                               // prefer a seat you can actually get
    v-=Math.max(0,(r[8]-3000))/20000;                    // nudge toward level-appropriate
    return v;
  };

  const chosen=[];let cr=0;
  for(let guard=0;guard<12;guard++){
    let best=null,bestV=0;
    cand.forEach(r=>{
      if(chosen.some(c=>codeOf(c)===codeOf(r)))return;
      if(cr+creditsOf(r)>maxC)return;
      if(chosen.some(c=>clashes(codeOf(c),codeOf(r))))return;
      const v=value(r,chosen);
      if(v>bestV||(v===bestV&&best&&isOpen(r)&&!isOpen(best))){bestV=v;best=r}
    });
    if(!best)break;
    chosen.push(best);cr+=creditsOf(best);
    slotsFilledBy(best,slots).forEach(sl=>{const k=sl.pid+'.'+sl.sid;if(need[k]>0)need[k]--});
    if(cr>=target)break;
    if(cr>=target-1&&cr>=12)break;    // stop near the target, but never below full-time
  }
  return{courses:chosen,slots:slots,credits:cr,
         covered:slots.length-Object.values(need).filter(v=>v>0).length};
}

/* Several options, not one answer. Students plan ahead and want to compare — so each
   option is generated with a different priority and carries the reason it exists. A list
   of five near-identical schedules would be useless; these differ in ways a student
   actually cares about. */
const OPTION_KINDS=[
  {id:'max',   name:'Knocks out the most',   why:'Every class here counts toward several things at once.',
   opts:{}},
  {id:'open',  name:'Everything has seats',  why:'Only classes with room right now — the safest to actually get.',
   opts:{onlyOpen:true}},
  {id:'light', name:'Lighter load',          why:'Still full-time, but the smallest credit count that works.',
   opts:{light:true}},
  {id:'late',  name:'No early mornings',     why:'Nothing starts before 10am.',
   opts:{notBefore:600}},
  {id:'tight', name:'Fewer days on campus',  why:'Classes packed into as few days as possible.',
   opts:{compact:true}}
];
function generateOptions(){
  const out=[];
  OPTION_KINDS.forEach(k=>{
    const base={maxLevel:3999,credits:k.opts.light?Math.max(12,targetCr-3):targetCr};
    const r=generateSchedule(Object.assign(base,k.opts));
    if(!r.courses.length)return;
    if(r.credits<12)return;           // an under-full-time plan is not a plan
    const key=r.courses.map(codeOf).sort().join('|');
    if(out.some(o=>o.key===key))return;      // do not show the same schedule twice
    const days=new Set();r.courses.forEach(c=>[...(c[4][0]||'')].forEach(d=>days.add(d)));
    out.push({id:k.id,name:k.name,why:k.why,key:key,res:r,
      days:days.size,
      allOpen:r.courses.every(isOpen),
      fills:r.courses.reduce((a,c)=>a+slotsFilledBy(c,r.slots).length,0)});
  });
  return out;
}

/* Backups: same requirement, still open, and it has to actually fit the hole — no clash
   with the courses that would remain. Without that last check a "backup" can be
   unschedulable, which is worse than none. */
function backupsFor(code,chosen){
  const r=rec(code);if(!r)return[];
  const slots=openSlots(), mine=slotsFilledBy(r,slots);
  if(!mine.length)return[];
  const others=chosen.filter(c=>c!==code);
  const keys=mine.map(sl=>sl.pid+'.'+sl.sid);
  return CAT.filter(x=>{
    if(codeOf(x)===code)return false;
    if(!x[4].length)return false;
    if(x[8]>=5000)return false;      // graduate courses are not a fallback an undergrad can take
    if(x[8]>r[8]+1000)return false;  // nor is a 3000-level course a fallback for a 1000-level one
    if(doneCourses.indexOf(codeOf(x))>-1)return false;
    if(chosen.indexOf(codeOf(x))>-1)return false;
    if(violatesRules(x))return false;
    if(!prereqMet(x,others))return false;
    if(others.some(o=>clashes(o,codeOf(x))))return false;
    return slotsMatchedBy(x,slots).some(sl=>keys.indexOf(sl.pid+'.'+sl.sid)>-1);
  }).map(x=>{
    const sharedSlots=slotsMatchedBy(x,slots).filter(sl=>keys.indexOf(sl.pid+'.'+sl.sid)>-1);
    // Rank by the most specific requirement shared. Sharing an explicit course list means
    // it genuinely replaces the course; sharing only a distribution tag does not — that is
    // how organic chemistry turned up as a "backup" for general chemistry.
    const spec=Math.max.apply(null,sharedSlots.map(slotSpecificity).concat([0]));
    return{r:x,code:codeOf(x),shared:sharedSlots.length,spec:spec,
           covers:sharedSlots.map(sl=>sl.sname),
           total:slotsFilledBy(x,slots).length,open:isOpen(x)};
  })
   .sort((a,b)=>(b.spec-a.spec)||(b.open-a.open)||(b.shared-a.shared)||(b.total-a.total))
   .slice(0,4);
}
/* ===== THE BOARD =====
   Students mostly know what they want to take. The pain is enrollment morning and
   add/drop: the class is full, now what? So this is not a generator — it is a
   contingency board. Your intended courses, what is open, and for each one the ranked
   fallbacks that keep the same requirement. Coursicle tells you when a seat frees up;
   nothing tells you what to take instead that still counts. That is the gap. */
let dropped=S('dropped')||[];
let openChain={}, openNode={}, openDetail={};
/* one more level down: what covers the requirement if the first fallback ALSO fills */
function pathKids(orig,mid,codes){
  const swapped=codes.map(c=>c===orig?mid:c);
  return backupsFor(mid,swapped).filter(k=>k.code!==orig).slice(0,2);
}        // courses you tried for and did not get
let boardQ='', step=(S('myprograms')||[]).length?(S('step')||'board'):'ask';

}

    <div class="row" style="align-items:center;margin-bottom:6px">
      <span style="font-size:15px;flex:1;color:${bcolor(n)}">${n.emoji||'●'} ${n.label}</span>
      ${n.id!=='root'?`<button class="b" onclick="renB()" title="rename">✎</button><button class="b rm" onclick="delB()" title="delete branch">🗑</button>`:''}
    </div>
    <div class="row" style="flex-wrap:wrap;gap:5px;margin-bottom:10px">
      ${BCOLORS.map(c=>`<span onclick="setBColor('${c}')" style="width:16px;height:16px;border-radius:50%;background:${c};cursor:pointer;border:2px solid ${bcolor(n)===c?'#fff':'transparent'}"></span>`).join('')}
      <input type="text" maxlength="2" value="${n.emoji||''}" placeholder="🙂" onchange="setBEmoji(this.value)" style="width:44px;text-align:center;padding:3px" title="emoji">
    </div>
    <div style="font-size:10px;letter-spacing:1.5px;color:var(--dim);margin-bottom:6px">TO-DOS FOR THIS NODE ${tasks.length?`· ${done}/${tasks.length}`:''}</div>
    ${tasks.length?`<div style="margin-bottom:6px">${tasks.map((t,i)=>`<div class="todo" style="padding:6px 0;font-size:11.5px"><input type="checkbox" ${t.d?'checked':''} onchange="bTask(${i})"><span class="${t.d?'dim':''}" style="${t.d?'text-decoration:line-through':''}">${t.t}</span><span class="x" onclick="bTaskDel(${i})">✕</span></div>`).join('')}</div>`:'<div class="fine" style="margin-bottom:6px">nothing here yet</div>'}
    <div class="row"><input type="text" id="btIn" placeholder="add a to-do here… Enter" onkeydown="if(event.key==='Enter')bTaskAdd()" style="font-size:11px"><button class="b" onclick="bTaskAdd()">+</button></div>
    <div style="font-size:10px;letter-spacing:1.5px;color:var(--dim);margin:12px 0 4px">NOTE</div>
    <textarea placeholder="jot anything about ${n.label}…" oninput="setBNote(this.value)" style="height:80px;font-size:11.5px;resize:vertical">${n.note||''}</textarea>
    ${kids.length?`<div class="fine" style="margin-top:10px">branches: ${kids.map(k=>`<span style="color:${bcolor(k)};cursor:pointer" onclick="selB='${k.id}';drawB();drawBPanel()">${k.emoji||''}${k.label}</span>`).join(' · ')}</div>`:''}
  </div>`;
}
function addB(){const i=document.getElementById('bIn');if(!i||!i.value.trim())return;
  const id='n'+Date.now();brainN.push({id,label:i.value.trim(),parent:selB,tasks:[]});S('brain',brainN);i.value='';selB=id;drawB();drawBPanel();toast('branch added')}
function renB(){const n=bnode(selB);if(!n||n.id==='root')return;const v=prompt('rename:',n.label);if(v&&v.trim()){n.label=v.trim();S('brain',brainN);drawB();drawBPanel()}}
function delB(){if(selB==='root'){toast('the core stays put');return}
  const kill=new Set([selB]);let ch=true;while(ch){ch=false;brainN.forEach(n=>{if(n.parent&&kill.has(n.parent)&&!kill.has(n.id)){kill.add(n.id);ch=true}})}
  const p=bnode(selB).parent;brainN=brainN.filter(n=>!kill.has(n.id));selB=p||'root';S('brain',brainN);drawB();drawBPanel()}
function setBColor(c){const n=bnode(selB);if(!n)return;n.color=c;S('brain',brainN);drawB();drawBPanel()}
function setBEmoji(e){const n=bnode(selB);if(!n)return;n.emoji=e.trim()||undefined;S('brain',brainN);drawB();drawBPanel()}
function setBNote(v){const n=bnode(selB);if(!n)return;n.note=v;S('brain',brainN)}
function bTaskAdd(){const i=document.getElementById('btIn');if(!i||!i.value.trim())return;const n=bnode(selB);n.tasks=n.tasks||[];n.tasks.push({t:i.value.trim(),d:false});S('brain',brainN);drawBPanel();drawB()}
function bTask(i){const n=bnode(selB);n.tasks[i].d=!n.tasks[i].d;S('brain',brainN);drawBPanel();drawB()}
function bTaskDel(i){const n=bnode(selB);n.tasks.splice(i,1);S('brain',brainN);drawBPanel();drawB()}
function bFit(){bView={sc:1,tx:0,ty:0};drawB()}
function drawB(){
  const svg=document.getElementById('bsvg');if(!svg)return;svg.innerHTML='';
  const NS='http://www.w3.org/2000/svg',W=svg.clientWidth||900,H=svg.clientHeight||560;
  const g=document.createElementNS(NS,'g');svg.appendChild(g);
  const kids=id=>brainN.filter(n=>n.parent===id);
  const pos={root:[W/2,H/2]};
  const l1=kids('root');
  l1.forEach((n,i)=>{const a=(i/Math.max(l1.length,1))*2*Math.PI-Math.PI/2,R=Math.min(W,H)*.27;
    pos[n.id]=[W/2+R*Math.cos(a),H/2+R*Math.sin(a)];
    const l2=kids(n.id),span=Math.PI/Math.max(l1.length,1)*1.7;
    l2.forEach((k,j)=>{const ka=a+(l2.length>1?(j/(l2.length-1)-.5)*span:0),R2=R+Math.min(W,H)*.2;
      pos[k.id]=[W/2+R2*Math.cos(ka),H/2+R2*Math.sin(ka)];
      const l3=kids(k.id);
      l3.forEach((m,x)=>{const ma=ka+(l3.length>1?(x/(l3.length-1)-.5)*span*.6:0),R3=R2+Math.min(W,H)*.15;
        pos[m.id]=[W/2+R3*Math.cos(ma),H/2+R3*Math.sin(ma)]})})});
  brainN.forEach(n=>{if(!pos[n.id])pos[n.id]=[W/2+(Math.random()-.5)*200,H/2+(Math.random()-.5)*200]});
  brainN.forEach(n=>{if(!n.parent)return;const p=document.createElementNS(NS,'path');
    const[a,b]=[pos[n.parent],pos[n.id]];
    p.setAttribute('d',`M${a[0]},${a[1]} Q${(a[0]+b[0])/2},${(a[1]+b[1])/2} ${b[0]},${b[1]}`);
    p.setAttribute('fill','none');p.setAttribute('stroke',bcolor(n));p.setAttribute('stroke-width','1.4');p.setAttribute('opacity','.5');g.appendChild(p)});
  brainN.forEach(n=>{
    const grp=document.createElementNS(NS,'g');grp.setAttribute('class','nd'+(n.id===selB?' sel':''));grp.style.cursor='pointer';
    const[x,y]=pos[n.id],r=n.id==='root'?32:n.parent==='root'?20:13,col=bcolor(n);
    const tasks=bTasks(n),done=tasks.filter(t=>t.d).length,open=tasks.length-done;
    const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',r);
    c.setAttribute('fill',n.id===selB?col:'var(--panel)');c.setAttribute('stroke',col);c.setAttribute('stroke-width',n.id===selB?3:1.6);
    if(open>0){const pulse=document.createElementNS(NS,'animate');pulse.setAttribute('attributeName','stroke-opacity');pulse.setAttribute('values','1;.35;1');pulse.setAttribute('dur','2s');pulse.setAttribute('repeatCount','indefinite');c.appendChild(pulse)}
    grp.appendChild(c);
    if(n.emoji){const em=document.createElementNS(NS,'text');em.setAttribute('x',x);em.setAttribute('y',y+r/3);em.setAttribute('text-anchor','middle');em.setAttribute('font-size',r*0.9);em.textContent=n.emoji;grp.appendChild(em)}
    const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',n.id==='root'&&!n.emoji?y+4:y+r+13);t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size',n.id==='root'?12:n.parent==='root'?10.5:9);t.setAttribute('fill',n.id===selB?col:'#F3F3F9');t.textContent=n.label;grp.appendChild(t);
    if(tasks.length){const bd=document.createElementNS(NS,'text');bd.setAttribute('x',x+r-2);bd.setAttribute('y',y-r+4);bd.setAttribute('text-anchor','middle');bd.setAttribute('font-size',9);bd.setAttribute('fill',open?'#FFD24C':'#34D399');bd.textContent=open?open:'✓';grp.appendChild(bd)}
    grp.addEventListener('click',e=>{e.stopPropagation();selB=n.id;drawB();drawBPanel()});
    g.appendChild(grp);
  });
  let{sc,tx,ty}=bView,dr=null;
  const ap=()=>{g.setAttribute('transform',`translate(${tx},${ty}) scale(${sc})`);bView={sc,tx,ty}};ap();
  svg.onwheel=e=>{e.preventDefault();const f=e.deltaY<0?1.1:.9;tx=e.offsetX-(e.offsetX-tx)*f;ty=e.offsetY-(e.offsetY-ty)*f;sc=Math.max(.3,Math.min(4,sc*f));ap()};
  svg.onmousedown=e=>{dr={x:e.clientX-tx,y:e.clientY-ty};svg.classList.add('g')};
  svg.onmousemove=e=>{if(dr){tx=e.clientX-dr.x;ty=e.clientY-dr.y;ap()}};
  svg.onmouseup=svg.onmouseleave=()=>{dr=null;svg.classList.remove('g')};
}
/* onboarding — first run */
/* The old school modal and the three-step interest wizard are gone from the normal path.
   The whole setup is now three dropdowns on one screen. openSetup() still exists for the
   older tabs behind "more tools", but nothing in the main flow opens it. */
function greet(){
  const n=S('user');if(!n)return;
  const h=new Date().getHours();
  document.getElementById('greet').textContent=(h<12?'good morning':h<18?'good afternoon':'good evening')+', '+n;
}
/* boot */
crTop();
go('plan_');
// Anyone who set up before the school question existed is already a Cornell user;
// don't make them sit through onboarding again.
if(!S('school')&&S('user'))S('school','cornell');
greet();  // the school question now lives on the first screen, not in a modal of its own
